spring.application.name=demo

# --- Database ---
# Gerçek değerler ortam değişkenlerinden okunur (bkz. .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=8080

# --- JWT ---
# Production'da mutlaka JWT_SECRET ortam değişkeni ile değiştirilmelidir.
jwt.secret=${JWT_SECRET:dev-only-football-stats-jwt-secret-change-me-0123456789abcdef}
