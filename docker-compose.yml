services:
  db:
    image: postgres:16-alpine
    container_name: football-db
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football
      POSTGRES_PASSWORD: ${DB_PASSWORD:-football}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./demo
    container_name: spring-boot-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/football
      DB_USERNAME: football
      DB_PASSWORD: ${DB_PASSWORD:-football}
      JWT_SECRET: ${JWT_SECRET:-dev-only-football-stats-jwt-secret-change-me-0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontent
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
